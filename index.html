<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>You're invited</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form id="gate" autocomplete="off" hidden>
      <h1>You're invited</h1>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Enter</button>
      <p id="msg" role="alert"></p>
    </form>

    <section id="invite" hidden>
      <img id="flyer" alt="Party invitation flyer">
      <div id="extra"></div>
      <form id="cal">
        <!-- TODO: calendar feature — details to come -->
        <input type="email" placeholder="Email for calendar invite" disabled>
        <button type="submit" disabled>Add to calendar</button>
        <p class="note">Coming soon</p>
      </form>
    </section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
