<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>hannah & calvin's latest party</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form id="gate" autocomplete="off" hidden>
      <h1>come to our party! pw first tho</h1>
      <label for="pw">password</label>
      <div class="row">
        <input id="pw" name="invite-code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore required autofocus>
        <button type="submit">enter</button>
      </div>
      <p id="msg" role="alert"></p>
    </form>

    <section id="invite" hidden>
      <h1>
        you're invited to H&C's latest!
      </h1>
      <img id="flyer" alt="Party invitation flyer">
      <div id="extra">
        <p>excited to see you! let us know you're coming (or not) by using the calendar RSVP below.</p>
      </div>
      <form id="cal" autocomplete="off" novalidate hidden>
        <label for="email">want a calendar invite? drop your email</label>
        <div class="row">
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
          <button type="submit">add to calendar</button>
        </div>
        <!-- honeypot: real users never see/fill this -->
        <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p id="cal-msg" class="note" role="status"></p>
      </form>
      <br/><br/><br/>
      <footer>collage by hannah, site by calvin | <a href="#" id="forget">(forget this device)</a></footer>
    </section>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
